name: EDCB Uploader Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-uploader:
    name: Build EDCB uploader Windows package
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file executable
        shell: pwsh
        run: |
          dotnet publish '.\tools\jkcnsl-edcb-epg-uploader\jkcnsl-edcb-epg-uploader.csproj' `
            /p:PublishProfile=Properties\PublishProfiles\win-x64-single-file.pubxml

      - name: Package uploader artifact
        shell: pwsh
        env:
          PACKAGE_NAME: jkcnsl-edcb-epg-uploader-${{ github.ref_name || 'dev' }}-win-x64
        run: |
          $publishDir = Join-Path $PWD 'tools\jkcnsl-edcb-epg-uploader\bin\publish\win-x64'
          $packageDir = Join-Path $PWD 'package'
          $targetDir = Join-Path $packageDir $env:PACKAGE_NAME

          if (-not (Test-Path $publishDir)) {
            throw "Publish output was not found: $publishDir"
          }

          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item -Path (Join-Path $publishDir '*') -Destination $targetDir -Recurse -Force

          $secretSettings = Join-Path $targetDir 'local\appsettings.json'
          if (Test-Path $secretSettings) {
            Remove-Item -LiteralPath $secretSettings -Force
          }

          Copy-Item -LiteralPath '.\tools\jkcnsl-edcb-epg-uploader\README.md' -Destination (Join-Path $targetDir 'README.md') -Force

          $archive = Join-Path $PWD "$env:PACKAGE_NAME.zip"
          if (Test-Path $archive) {
            Remove-Item -LiteralPath $archive -Force
          }

          Compress-Archive -Path (Join-Path $targetDir '*') -DestinationPath $archive -Force
          "UPLOADER_PACKAGE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: edcb-uploader-windows-x64
          path: ${{ env.UPLOADER_PACKAGE }}
          retention-days: 7

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.UPLOADER_PACKAGE }}
