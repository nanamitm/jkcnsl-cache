name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android arm64-v8a APK
    runs-on: ubuntu-latest

    env:
      QT_VERSION: '6.11.1'
      NDK_VERSION: '27.2.12479018'
      BUILD_TOOLS_VERSION: '36.0.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            ndk;${{ env.NDK_VERSION }}
            platforms;android-36
            build-tools;${{ env.BUILD_TOOLS_VERSION }}

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          extra: --autodesktop
          cache: true

      - name: Restore signing keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is required." >&2
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Configure
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_storeFile: ${{ runner.temp }}/release.jks
          ANDROID_storePassword: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cmake -S jkcnsl-cache/android -B build-android -G Ninja -Wno-dev \
            "-DCMAKE_TOOLCHAIN_FILE=${QT_ROOT_DIR}/lib/cmake/Qt6/qt.toolchain.cmake" \
            "-DQT_HOST_PATH=${QT_HOST_PATH}" \
            "-DCMAKE_MAKE_PROGRAM=$(which ninja)" \
            "-DANDROID_ABI=arm64-v8a" \
            "-DANDROID_PLATFORM=android-35" \
            "-DANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" \
            "-DANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" \
            "-DCMAKE_BUILD_TYPE=Release"

      - name: Build APK
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_storeFile: ${{ runner.temp }}/release.jks
          ANDROID_storePassword: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cmake --build build-android --target apk

      - name: Prepare APK artifact
        env:
          APK_NAME: jkcnsl-${{ github.ref_name || 'dev' }}-android-arm64.apk
        run: |
          src="$(find build-android/android-build/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$src" ]; then
            echo "Release APK was not found." >&2
            find build-android -name '*.apk' -print
            exit 1
          fi

          apksigner="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          if ! "$apksigner" verify --verbose "$src"; then
            "$apksigner" sign \
              --ks "${{ runner.temp }}/release.jks" \
              --ks-pass "pass:${{ secrets.ANDROID_STORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
              --out "${APK_NAME}" \
              "$src"
          else
            cp "$src" "${APK_NAME}"
          fi

          "$apksigner" verify --verbose "${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-release
          path: ${{ env.APK_NAME }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
