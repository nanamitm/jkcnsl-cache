name: Client Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64 package
    runs-on: windows-2022

    env:
      QT_VERSION: '6.10.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt for Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          cmake -S jkcnsl-cache/android -B build-windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build-windows --config Release

      - name: Package
        shell: pwsh
        env:
          PACKAGE_NAME: jkcnsl-${{ github.ref_name || 'dev' }}-windows-x64
        run: |
          $packageDir = Join-Path "package" $env:PACKAGE_NAME
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Path "build-windows\jkcnsl-qt.exe" -Destination $packageDir

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --qmldir "$PWD\jkcnsl-cache\android\qml" `
            "$packageDir\jkcnsl-qt.exe"

          $archive = "$env:PACKAGE_NAME.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $archive -Force
          "WINDOWS_PACKAGE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-release
          path: ${{ env.WINDOWS_PACKAGE }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.WINDOWS_PACKAGE }}

  linux-appimage:
    name: Build Linux x86_64 AppImage
    runs-on: ubuntu-latest

    env:
      QT_VERSION: '6.11.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build and AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            file \
            libgl1-mesa-dev \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            ninja-build \
            patchelf \
            wget

      - name: Install Qt for Linux
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebsockets
          cache: true

      - name: Configure
        run: |
          cmake -S jkcnsl-cache/android -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=${QT_ROOT_DIR}"

      - name: Build
        run: cmake --build build-linux --config Release

      - name: Package AppImage
        env:
          APPIMAGE_NAME: jkcnsl-${{ github.ref_name || 'dev' }}-linux-x86_64.AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/192x192/apps

          cp build-linux/jkcnsl-qt AppDir/usr/bin/
          cp jkcnsl-cache/android/android/res/mipmap-xxxhdpi/ic_launcher.png \
            AppDir/usr/share/icons/hicolor/192x192/apps/jkcnsl.png

          cat > AppDir/usr/share/applications/jkcnsl.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=jkcnsl
          Exec=jkcnsl-qt
          Icon=jkcnsl
          Categories=Network;AudioVideo;
          EOF

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          export APPIMAGE_EXTRACT_AND_RUN=1
          export QML_SOURCES_PATHS="${PWD}/jkcnsl-cache/android/qml"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage

          produced="$(find . -maxdepth 1 -name '*.AppImage' | head -1)"
          if [ -z "$produced" ]; then
            echo "AppImage was not produced." >&2
            exit 1
          fi
          mv "$produced" "${APPIMAGE_NAME}"
          echo "APPIMAGE_NAME=${APPIMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-appimage
          path: ${{ env.APPIMAGE_NAME }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APPIMAGE_NAME }}

  android:
    name: Build Android arm64-v8a APK
    runs-on: ubuntu-latest

    env:
      QT_VERSION: '6.11.1'
      NDK_VERSION: '27.2.12479018'
      BUILD_TOOLS_VERSION: '36.0.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            ndk;${{ env.NDK_VERSION }}
            platforms;android-36
            build-tools;${{ env.BUILD_TOOLS_VERSION }}

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtwebsockets
          extra: --autodesktop
          cache: true

      - name: Restore signing keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is required." >&2
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Configure
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_storeFile: ${{ runner.temp }}/release.jks
          ANDROID_storePassword: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cmake -S jkcnsl-cache/android -B build-android -G Ninja -Wno-dev \
            "-DCMAKE_TOOLCHAIN_FILE=${QT_ROOT_DIR}/lib/cmake/Qt6/qt.toolchain.cmake" \
            "-DQT_HOST_PATH=${QT_HOST_PATH}" \
            "-DCMAKE_MAKE_PROGRAM=$(which ninja)" \
            "-DANDROID_ABI=arm64-v8a" \
            "-DANDROID_PLATFORM=android-35" \
            "-DANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" \
            "-DANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" \
            "-DCMAKE_BUILD_TYPE=Release"

      - name: Build APK
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_storeFile: ${{ runner.temp }}/release.jks
          ANDROID_storePassword: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          cmake --build build-android --target apk
          build_exit=$?
          set -e

          if [ "$build_exit" -ne 0 ]; then
            echo "cmake --build exited with ${build_exit}; checking for a Gradle-produced APK."
          fi

          if [ "$build_exit" -ne 0 ] && ! find build-android -name '*.apk' | grep -q .; then
            echo "APK build failed and no APK was produced." >&2
            exit "$build_exit"
          fi

      - name: Prepare APK artifact
        env:
          APK_NAME: jkcnsl-${{ github.ref_name || 'dev' }}-android-arm64.apk
        run: |
          src="$(find build-android/android-build/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$src" ]; then
            echo "Release APK was not found." >&2
            find build-android -name '*.apk' -print
            exit 1
          fi

          apksigner="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          if ! "$apksigner" verify --verbose "$src"; then
            "$apksigner" sign \
              --ks "${{ runner.temp }}/release.jks" \
              --ks-pass "pass:${{ secrets.ANDROID_STORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
              --out "${APK_NAME}" \
              "$src"
          else
            cp "$src" "${APK_NAME}"
          fi

          "$apksigner" verify --verbose "${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-arm64-release
          path: ${{ env.APK_NAME }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APK_NAME }}
