server {
    listen 443 ssl;
    server_name your-vps.example.com;

    ssl_certificate     /etc/letsencrypt/live/your-vps.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-vps.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # WebSocket 専用設定
    location /watch/ {
        proxy_pass http://127.0.0.1:5000/watch/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /comment/ {
        proxy_pass http://127.0.0.1:5000/comment/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API・Webクライアント（静的ファイル）
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    server_name your-vps.example.com;
    return 301 https://$host$request_uri;
}
